name: Rust

on:
  - push
  - pull_request

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: yadex
            binary: yadex
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: yadex-arm64
            binary: yadex-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Generate Cargo.toml.cache (Ignore version=)
      run: |
        sed '/^version = /d' Cargo.toml > Cargo.toml.cache
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git
          target
        key: musl-cargo-${{ matrix.target }}-${{ hashFiles('./Cargo.toml.cache') }}
    # - name: Remove files for a build with correct version info
    #   run: |
    #     find target/ -name 'shadow*' -exec rm -r {} + || true
    #     find target/ -name 'yadex' -delete || true
    - name: Test & Compile
      run: |
        mkdir -p ~/.cargo/{git,registry}
        # Fix git permission issue with Docker and shadow-rs
        sudo chown -R root .
        docker run --rm -t \
            --mount type=bind,source=${{ github.workspace }},target=/volume \
            --mount type=bind,source="$HOME/.cargo/registry",target=/root/.cargo/registry \
            --mount type=bind,source="$HOME/.cargo/git",target=/root/.cargo/git \
            --network=host \
            clux/muslrust:stable \
            cargo test
        docker run --rm -t \
            --mount type=bind,source=${{ github.workspace }},target=/volume \
            --mount type=bind,source="$HOME/.cargo/registry",target=/root/.cargo/registry \
            --mount type=bind,source="$HOME/.cargo/git",target=/root/.cargo/git \
            --network=host \
            clux/muslrust:stable \
            cargo build --release
        sudo chown -R runner ~/.cargo/
        sudo chown -R runner .
        # # show version info
        # RUST_LOG=debug target/${{ matrix.target }}/release/yadex --version
    
    - name: Debian package bundling
      run: |
        cargo install cargo-deb
        mkdir -p target/release
        cp -a target/${{ matrix.target }}/release/yadex target/release/yadex
        cargo deb --no-build

    - name: Stage artifacts
      run: |
        mkdir -p dist
        cp target/${{ matrix.target }}/release/yadex dist/${{ matrix.binary }}
        cp target/debian/yadex_*.deb dist/
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: dist/
        if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: yadex*
        path: dist
        merge-multiple: true
    - name: Deploy - Create and Upload Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: dist/*
