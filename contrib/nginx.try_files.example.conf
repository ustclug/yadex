# This is an example config that could be directly loaded by nginx:
# nginx -p $(pwd) -c ./contrib/nginx.example.conf

worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr info;
daemon off;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/nginx_client_body;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;
    access_log /dev/stdout;
    server {
        listen 127.0.0.1:8080;
        server_name _;
        root /srv/repo/;
        autoindex off;
        index index.html index.htm;

        # "${uri}index.html", not "$uri/index.html": try_files serves what it finds right
        # here, in the server context. For a directory requested WITHOUT the trailing
        # slash, "$uri/index.html" would hand out <dir>/index.html without "location
        # /dir/ { ... }" (and its access rules) ever being consulted.
        try_files $uri ${uri}index.html ${uri}index.htm @yadex_check;

        location @yadex_check {
            internal;
            if (-d $request_filename) {
                # Only URIs that already end with "/" are handed to yadex.
                rewrite ^(.*/)$ /_yadex$1 last;
            }
            # Everything else falls through to nginx's static module on purpose:
            #  - a directory requested WITHOUT the trailing slash gets nginx's usual
            #    301 redirect to "<uri>/". Do not list it right away: "/private"
            #    does not match "location /private/ { deny all; }" style access
            #    rules, only the redirected "/private/" does;
            #  - anything that does not exist gets a 404.
        }

        location /_yadex/ {
            internal;
            proxy_pass http://127.0.0.1:8880/;
        }
    }
}
