# This is an example config that could be directly loaded by nginx:
# nginx -p $(pwd) -c ./contrib/nginx.example.conf

worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr info;
daemon off;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/nginx_client_body;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;
    access_log /dev/stdout;
    server {
        listen 127.0.0.1:8080;
        server_name _;
        root /srv/repo/;
        autoindex off;
        index index.html /_yadex;

        # Remember the URI as normalised by nginx (percent-decoded, "." and ".."
        # resolved, slashes merged): this is the URI that location matching and
        # every access rule (allow/deny, auth_basic, ...) were evaluated against.
        # It has to be captured here, because after the internal redirect done by
        # the index module $uri is just "/_yadex".
        # Note: this runs before "rewrite" rules placed inside your own locations.
        # If such a rule changes the URI of a directory request, set $yadex_dir to
        # the rewritten URI yourself, so that yadex lists what nginx authorised.
        if ($uri != /_yadex) {
            set $yadex_dir $uri;
        }

        location / {
            # some custom logic (try_files won't inherit...)
        }

        location = /_yadex {
            internal;
            # Hand yadex the normalised URI (nginx re-escapes it for the upstream
            # request). Never forward the raw $request_uri: "/private/../" is "/"
            # for nginx, but must not reach yadex as a request for "private".
            rewrite ^ $yadex_dir break;
            proxy_pass http://127.0.0.1:8880;
        }
    }
}
